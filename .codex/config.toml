# These defaults apply when Codex opens the BALLS project as its workspace.
# Codex uses the signed-in ChatGPT plan; BALLS does not call the API.
model = "gpt-6-luna"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 12
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
